<!DOCTYPE html>
<html lang="cs">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BIG BUNS ORDER</title>

<link rel="stylesheet"
href="../style.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;700;800&display=swap"
rel="stylesheet">

</head>

<body>

<!-- NAVBAR -->

<header class="navbar">

<div class="logo"
onclick="location.href='../index.html'">

BIG BUNS

</div>

<div class="nav-right">

<div class="delivery-badge">

🔥 Rozvoz do 45 min

</div>

<div class="cart-floating"
onclick="toggleCart()">

🛒
<span id="cartCount">
0
</span>

</div>

</div>

</header>

<!-- HERO -->

<section class="order-hero">

<h1>

ORDER NOW

</h1>

<p>

Premium streetfood delivery.

</p>

</section>

<!-- TABS -->

<section class="tabs">

<button onclick="renderCategory('burgers')">

🍔 BURGERS

</button>

<button onclick="renderCategory('premium')">

🔥 PREMIUM

</button>

<button onclick="renderCategory('sides')">

🍟 SIDES

</button>

<button onclick="renderCategory('drinks')">

🥤 DRINKS

</button>

<button onclick="renderCategory('dips')">

🥣 DIPS

</button>

</section>

<!-- PRODUCTS -->

<section
class="products-grid"
id="products">

</section>

<!-- CART -->

<div class="cart-panel"
id="cartPanel">

<div class="cart-header">

<h2>
Košík
</h2>

<button onclick="toggleCart()">

✕

</button>

</div>

<div id="cartItems">

</div>

<div class="cart-footer">

<h3>

Celkem:
<span id="cartTotal">

0 Kč

</span>

</h3>

<button id="checkoutBtn">

CHECKOUT

</button>

</div>

</div>

<script src="../order.js"></script>

</body>
</html>
