<!DOCTYPE html>
<html lang="cs">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BIG BUNS ORDER</title>

<link rel="stylesheet" href="../style.css">

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<header class="navbar">

<a href="../index.html" class="logo">
BIG BUNS
</a>

<div class="cart-btn" onclick="toggleCart()">

🛒

<span id="cart-count">
0
</span>

</div>

</header>

<section class="order-hero">

<h1>
ORDER NOW
</h1>

<p>
Premium streetfood delivery.
</p>

</section>

<section class="tabs">

<button class="active" onclick="filterProducts('burgers', this)">
🍔 BURGERS
</button>

<button onclick="filterProducts('premium', this)">
🔥 PREMIUM
</button>

<button onclick="filterProducts('sides', this)">
🍟 SIDES
</button>

<button onclick="filterProducts('drinks', this)">
🥤 DRINKS
</button>

<button onclick="filterProducts('dips', this)">
🥣 DIPS
</button>

</section>

<section class="products-grid" id="products-grid"></section>

<div class="cart-panel" id="cart-panel">

<div class="cart-top">

<h2>
Košík
</h2>

<button onclick="toggleCart()">
✕
</button>

</div>

<div id="cart-items"></div>

<div class="cart-bottom">

<div class="cart-total">
Celkem:
<span id="cart-total">
0 Kč
</span>
</div>

<button class="checkout-btn">
CHECKOUT
</button>

</div>

</div>

<script src="../order.js"></script>

</body>
</html>
