<!DOCTYPE html>
<html lang="cs">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>BIG BUNS</title>

  <link rel="stylesheet"
  href="style.css">

</head>

<body>

<!-- ========================================= -->
<!-- NAVBAR -->
<!-- ========================================= -->

<nav class="navbar">

  <div class="logo">
    BIG BUNS
  </div>

  <div class="nav-right">

    <div class="delivery">
      🔥 Rozvoz do 45 min
    </div>

    <div class="cart">

      🛒

      <div
      id="cart-count"

  </div>

</nav>

<!-- ========================================= -->

<!-- ========================================= -->

<section class="hero">

  <div class="hero-image"></div>

  <div class="hero-content">

      BIG<br>
      BUNS

    </p>

    <button class="order-btn">

      🍔 ORDER NOW

    </button>

  </div>

</section>

<!-- ========================================= -->

<!-- ========================================= -->

<section class="rating-bar">

  <div>
    ⭐ 4.8 / 5

  </div>

  <div>
    🍔 1000+ OBJEDNÁVEK
  </div>

</section>

<!-- ========================================= -->
<!-- CATEGORIES -->
<!-- ========================================= -->

<section class="categories">

  <div
  class="category active"
  data-category="burgers">

    🍔

    <span>
      BURGERS
    </span>

  </div>

  <div
  class="category"
  data-category="premium">

    🔥

    <span>
      PREMIUM
    </span>

  </div>

  <div
  class="category"
  data-category="sides">

    🍟

    <span>
      SIDES
    </span>

  </div>

  <div
  class="category"
  data-category="drinks">

    🥤

    <span>
      DRINKS
    </span>

  </div>

  <div
  class="category"
  data-category="dips">

    🥣

    <span>
      DIPS
    </span>

  </div>

</section>

<!-- ========================================= -->
<!-- LIVE PILLS -->
<!-- ========================================= -->

<section class="live-orders">

  <div class="live-pill">
    🔥 Právě objednáno ve Vítkovicích
  </div>

  <div class="live-pill">
    ⚡ Double Trouble trenduje
  </div>

  <div class="live-pill">
    🍟 + hranolky jen za 79 Kč
  </div>

</section>

<!-- ========================================= -->
<!-- PRODUCTS -->
<!-- ========================================= -->

<div
id="products"
class="products">

</div>

<!-- ========================================= -->
<!-- FOOTER -->
<!-- ========================================= -->

<footer class="footer">

  <div class="footer-logo">

    BIG BUNS

  </div>

  <div class="footer-info">

    Ostrava • Vítkovice

  </div>

</footer>

<!-- ========================================= -->
<!-- SCRIPT -->
<!-- ========================================= -->

<script src="app.js"></script>

</html>
